<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>TravianBot Hesap</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f2eb;
        color: #211c16;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { margin: 0 auto; max-width: 440px; padding: 32px 16px; }
      h1 { margin: 0 0 16px; font-size: 22px; }
      .card { background: #fffaf4; border: 1px solid #e3d9cc; border-radius: 12px; padding: 18px; }
      p { line-height: 1.5; margin: 0 0 12px; }
      label { display: block; font-size: 13px; margin: 10px 0 4px; color: #6b6258; }
      input, button { width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid #d6cdc1; font: inherit; }
      input { padding: 0 12px; background: #fff; color: inherit; }
      button { margin-top: 14px; cursor: pointer; border-color: #b86517; background: #b86517; color: #fff; font-weight: 600; }
      button:disabled { opacity: 0.6; cursor: default; }
      .ok { color: #2f7a35; }
      .err { color: #b3261e; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>TravianBot</h1>
      <div class="card">
        <p id="message">Isleniyor...</p>
        <form id="resetForm" class="hidden">
          <label for="password">Yeni sifre (en az 6 karakter)</label>
          <input id="password" type="password" autocomplete="new-password" minlength="6" required />
          <label for="password2">Yeni sifre (tekrar)</label>
          <input id="password2" type="password" autocomplete="new-password" minlength="6" required />
          <button id="resetButton" type="submit">Sifreyi kaydet</button>
        </form>
      </div>
    </main>
    <script>
      // Supabase Auth e-posta baglantilarinin donus sayfasi (supabase/config.toml > site_url).
      //   #...&type=signup   -> e-posta dogrulandi
      //   #...&type=recovery -> yeni sifre formu (PUT /auth/v1/user)
      // index.html ve shared/backendConfig.ts ile ayni degerler olmalidir.
      const SUPABASE_URL = "https://smsvzsbxsorogipyoivs.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mSuUDrJ3nCsI2M2MbkxD5w_qlin_Jv9";

      const $ = (id) => document.getElementById(id);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(location.search);
      // Token'lar adres cubugunda / gecmiste kalmasin.
      history.replaceState(null, "", location.pathname);

      function show(text, cls) {
        const el = $("message");
        el.textContent = text;
        el.className = cls || "";
      }

      const error = hash.get("error_description") || query.get("error_description");
      const errorCode = hash.get("error_code") || query.get("error_code");
      const type = hash.get("type") || query.get("type");
      const accessToken = hash.get("access_token");

      if (error) {
        show(
          errorCode === "otp_expired"
            ? "Baglantinin suresi dolmus veya daha once kullanilmis. Uygulamadan yeni bir baglanti isteyin."
            : `Islem basarisiz: ${error}`,
          "err",
        );
      } else if (type === "recovery" && accessToken) {
        show("Hesabiniz icin yeni bir sifre belirleyin.");
        $("resetForm").classList.remove("hidden");
        $("resetForm").onsubmit = async (event) => {
          event.preventDefault();
          const password = $("password").value;
          if (password.length < 6) return show("Sifre en az 6 karakter olmali.", "err");
          if (password !== $("password2").value) return show("Sifreler eslesmiyor.", "err");
          $("resetButton").disabled = true;
          try {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
              method: "PUT",
              headers: {
                "content-type": "application/json",
                apikey: SUPABASE_PUBLISHABLE_KEY,
                authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ password }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              $("resetButton").disabled = false;
              return show(
                data.error_code === "same_password"
                  ? "Yeni sifre eskisiyle ayni olamaz."
                  : `Sifre guncellenemedi: ${data.msg || data.error_description || res.status}`,
                "err",
              );
            }
            $("resetForm").classList.add("hidden");
            show("Sifreniz guncellendi. TravianBot uygulamasina yeni sifrenizle giris yapabilirsiniz.", "ok");
          } catch {
            $("resetButton").disabled = false;
            show("Sunucuya ulasilamadi. Internet baglantinizi kontrol edin.", "err");
          }
        };
      } else if (accessToken || type === "signup" || type === "email_change") {
        show("E-posta adresiniz dogrulandi. TravianBot uygulamasina giris yapabilirsiniz.", "ok");
      } else {
        show("Bu sayfa e-posta dogrulama ve sifre sifirlama baglantilari icindir.");
      }
    </script>
  </body>
</html>
